name: Release

# Pushing a v* tag builds Fogway here and publishes the files on this
# repo's Releases page: the terminal builds for every target and the
# desktop app for Windows (cross-compiled), and the desktop app for macOS
# (built on a Mac). The builds are not signed; sign and notarise them
# before handing them out widely. Self-update stays off unless a build sets
# its feed (internal/update.FeedURL).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Terminal builds and the Windows app
        run: make release-cli release-windows
      - uses: actions/upload-artifact@v4
        with:
          name: cross
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The macOS app
        run: |
          make app
          mkdir -p dist
          ditto -c -k --keepParent fogway.app "dist/fogway-darwin-$(go env GOARCH).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    needs: [cross, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$REF" dist/* -R "$GITHUB_REPOSITORY" --title "$REF" --generate-notes
